<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Share &middot; Moontaxi Lab</title>
<style>
  :root{--bg:#0a0b0e;--ink:#eceae4;--muted:#8a8f98;--teal:#5ecfcf}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Jost","Century Gothic",-apple-system,sans-serif;font-weight:300;

  h1{font-weight:300;font-size:28px;letter-spacing:.02em;margin-bottom:6px}

  a.item{display:block;border-left:1px solid rgba(236,234,228,.2);padding:4px 0 4px 20px;margin-bottom:20px;
    color:var(--ink);text-decoration:none;transition:border-color .2s}
  a.item:hover{border-left-color:var(--teal)}
  a.item .t{font-weight:500;font-size:17px}
  a.item .d{color:var(--muted);font-size:13.5px;margin-top:2px}
  .foot{margin-top:44px;font-size:12.5px;color:var(--muted)}
  .foot a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
<main>
